services:
  flamez:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5177
      DATA_DIR: /var/lib/flamez
    ports:
      - "127.0.0.1:5177:5177"
    volumes:
      - flamez_data:/var/lib/flamez
    security_opt:
      - no-new-privileges:true
volumes:
  flamez_data:
