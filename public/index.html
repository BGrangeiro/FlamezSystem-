<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SistemaFlamez</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/flamez-favicon-white.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <img src="/assets/flamez-logo-transparent.png" alt="Logo FLAMEZ 3D" />
          </div>
          <div>
            <strong>FLAMEZ 3D</strong>
          </div>
        </div>

        <nav class="tabs" aria-label="Abas do sistema">
          <button class="tab active" data-sheet="produtos" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5M12 13v8M7.5 5.5l9 5"/></svg><span>Produtos</span></button>
          <button class="tab" data-sheet="encomendas" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h3"/></svg><span>Encomendas</span></button>
          <button class="tab" data-sheet="producao" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V8l6 4V8l6 4V3h4v18H4Z"/><path d="M8 17h1m4 0h1"/></svg><span>Produção</span></button>
          <button class="tab" data-sheet="filamentos" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="m6 6 4 4m4 4 4 4m0-12-4 4m-4 4-4 4"/></svg><span>Filamentos</span></button>
          <button class="tab" data-sheet="maquinas" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8V3h12v5M6 17H4V8h16v9h-2"/><path d="M7 14h10v7H7zM16 11h1"/></svg><span>Máquinas</span></button>
          <button class="tab" data-sheet="productStock" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Z"/><path d="m3 7 9 4 9-4M12 11v10M7 5l10 4"/></svg><span>Estoque de produtos</span></button>
          <button class="tab" data-sheet="materialStock" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Z"/><path d="m3 7 9 4 9-4M12 11v10M7 5l10 4"/></svg><span>Estoque de materiais</span></button>
          <button class="tab" data-sheet="reposicao" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5a5 5 0 0 0-6.3 6.3L3 18l3 3 5.2-5.2a5 5 0 0 0 6.3-6.3L14 13l-3-3 3.5-3.5Z"/></svg><span>Peças</span></button>
          <button class="tab" data-sheet="painel" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 3v18h17M8 17v-5m5 5V7m5 10V4"/></svg><span>Painel do mês</span></button>
          <button class="tab" data-sheet="companyExpenses" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2M7 5V3h10v2"/></svg><span>Custos da empresa</span></button>
        </nav>
        <button id="logoutButton" class="sidebar-logout" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg>
          <span>Sair</span>
        </button>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Gestão da produção</p>
            <h1 id="viewTitle">Produtos</h1>
          </div>

          <div class="actions">
            <span id="syncStatus" class="status neutral" hidden aria-live="polite"></span>
            <button id="variationButton" class="topbar-button hidden" type="button">Adicionar variação</button>
            <button id="refreshButton" class="icon-button" title="Atualizar dados" type="button">↻</button>
          </div>
        </header>

        <nav id="machineTabs" class="product-section-tabs machine-section-tabs hidden" role="tablist" aria-label="Seções de máquinas">
          <button id="machineCloudTab" class="product-section-tab active" data-machine-tab="cloud" type="button" role="tab" aria-selected="true" aria-controls="content">Bambu Cloud</button>
          <button id="machineRegisteredTab" class="product-section-tab" data-machine-tab="registered" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1">Máquinas cadastradas</button>
          <button id="machineLogTab" class="product-section-tab" data-machine-tab="log" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1">Log</button>
        </nav>

        <nav id="productionTabs" class="product-section-tabs production-section-tabs hidden" role="tablist" aria-label="Seções de produção">
          <button id="productionRegisteredTab" class="product-section-tab active" data-production-tab="registered" type="button" role="tab" aria-selected="true" aria-controls="content">Produção registrada</button>
          <button id="productionAutomaticTab" class="product-section-tab" data-production-tab="automatic" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1">Produção automática</button>
          <button id="productionLogTab" class="product-section-tab" data-production-tab="log" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1">Log automático</button>
        </nav>

        <section class="toolbar">
          <input id="searchInput" type="search" placeholder="Buscar..." />
          <button id="addButton" type="button">Adicionar</button>
        </section>

        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="variationDialog">
      <form method="dialog" class="dialog-card">
        <h2>Adicionar variação</h2>
        <label>
          Produto original
          <select id="variationSource"></select>
        </label>
        <div class="dialog-actions">
          <button value="cancel" class="ghost-button" type="submit">Cancelar</button>
          <button id="createVariationButton" value="default" type="button">Criar cópia</button>
        </div>
      </form>
    </dialog>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <h2>Nenhum registro encontrado</h2>
        <p>Adicione o primeiro item ou atualize os dados.</p>
      </div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
